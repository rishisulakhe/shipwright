apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: docker-dashboard
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: migrate
          image: shipwright-backend:prod
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/server", "--migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DATABASE_URL
            - name: MIGRATIONS_PATH
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: MIGRATIONS_PATH
      containers:
        - name: backend
          image: shipwright-backend:prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: JWT_SECRET
            - name: MIGRATIONS_PATH
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: MIGRATIONS_PATH
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
